<!doctype html>
<html lang="ko" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'unsafe-inline'; img-src 'self' blob: data: https: http:; font-src data:; connect-src 'self'; frame-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
  <meta name="referrer" content="no-referrer">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MD Viewer</title>
  <link rel="stylesheet" href="app.css">
  <script type="module" src="app.js"></script>
</head>
<body>
  <div id="app">
    <div id="menubar"></div>
    <div id="tabbar"></div>
    <div id="body">
      <aside id="side">
        <!-- 열린 파일을 목록으로 보일 때는 탭 줄(#tabbar)을 이 칸으로 옮긴다. -->
        <section id="open-files" class="side-section" hidden>
          <div class="side-head" data-s="openFilesTitle"></div>
        </section>
        <div id="side-split" role="separator" aria-orientation="horizontal" data-s-title="splitter" hidden></div>
        <section id="ws-section" class="side-section grow">
          <div class="side-head" data-s="workspaceTitle"></div>
          <div id="ws-body" class="side-body"></div>
        </section>
      </aside>
      <div id="resizer" class="resizer" role="separator" aria-orientation="vertical" data-s-title="resizer"></div>
      <main id="main">
        <div id="find-slot"></div>
        <div id="views" data-mode="preview" hidden>
          <div class="pane source"></div>
          <div class="pane preview"></div>
        </div>
        <div id="empty">
          <div class="empty-box">
            <h1>MD Viewer</h1>
            <p data-s="emptyHint"></p>
            <p>
              <button id="empty-open" class="primary" data-s="emptyOpen"></button>
              <button id="empty-folder" data-s="emptyFolder"></button>
              <button id="empty-restore" data-s="emptyRestore" hidden></button>
            </p>
            <h2 id="empty-recent-title" data-s="emptyRecent" hidden></h2>
            <ul id="empty-recent"></ul>
          </div>
        </div>
      </main>
      <div id="toc-resizer" class="resizer" role="separator" aria-orientation="vertical" data-s-title="resizer"></div>
      <aside id="toc-side">
        <div class="side-head" data-s="tocTitle"></div>
        <div id="toc-body" class="side-body"></div>
      </aside>
    </div>
    <div id="statusbar"></div>
  </div>
</body>
</html>
